name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (accepts licenses)
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug + release APKs
        run: gradle --no-daemon assembleDebug assembleRelease
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Locate APKs
        run: |
          mkdir -p dist
          DEBUG_APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)
          REL_APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$DEBUG_APK" || { echo "Debug APK not found"; exit 1; }
          cp "$DEBUG_APK" dist/AzaharCheatManager-debug.apk
          if [ -n "$REL_APK" ]; then cp "$REL_APK" dist/AzaharCheatManager-release.apk; fi
          ls -l dist

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AzaharCheatManager-debug.apk
          path: dist/AzaharCheatManager-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: AzaharCheatManager-release.apk
          path: dist/AzaharCheatManager-release.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports
